<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット画面</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <div class="chat-container">
        <!-- ヘッダー -->
        <header class="chat-header">
            F1好きの雑談ルーム
        </header>

        <!-- メインの会話エリア（吹き出し6つ） -->
        <div class="chat-messages">
            <div class="message left">
                <div class="bubble">次の鈴鹿サーキットのGP、めちゃくちゃ楽しみだね！</div>
            </div>
            <div class="message right">
                <div class="bubble">本当にね！Red Bull Racingのマシンは今年も速そうだし、マックス・フェルスタッペンの走りを生で見られるのが待ちきれないよ。</div>
            </div>
            <div class="message left">
                <div class="bubble">去年のレースも最高のバトルだったよね。</div>
            </div>
            <div class="message right">
                <div class="bubble">あの時の一瞬の判断力とコーナリングは鳥肌モノだった！</div>
            </div>
            <div class="message left">
                <div class="bubble">グッズの準備も万全？</div>
            </div>
            <div class="message right">
                <div class="bubble">ジャケットとキャップはもちろん準備してあるよ！</div>
            </div>
        </div>

        <!-- 下部の入力欄と送信ボタン -->
        <div class="chat-input-area">
            <input type="text" placeholder="メッセージを入力..." class="chat-input">
            <button class="chat-button">送信</button>
        </div>
    </div>

</body>
</html>
